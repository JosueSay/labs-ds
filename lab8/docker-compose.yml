# docker-compose up

version: "3.9"

services:
  spark:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-jupyter
    ports:
      - "8888:8888" # Jupyter
    volumes:
      - ./notebooks:/home/jovyan/work # Carpeta local montada en el contenedor
    environment:
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=jupyter
      - PYSPARK_DRIVER_PYTHON_OPTS="notebook --ip=0.0.0.0 --no-browser --allow-root"
    command: >
      start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''
    # instalar librerías extra al levantar el contenedor
    init: true
    entrypoint: >
      sh -c "pip install pandas numpy matplotlib seaborn scikit-learn &&
             start-notebook.sh --NotebookApp.token='' --NotebookApp.password=''"
